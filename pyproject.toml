[project]
name = "hat-syslog"
version = "0.7.29"
description = "Hat Syslog"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "appdirs ~=1.4.4",
    "hat-aio ~=0.7.15",
    "hat-json ~=0.6.9",
    "hat-juggler ~=0.7.8",
    "hat-util ~=0.6.25",
]
classifiers = [
    "Programming Language :: Python :: 3"
]

[project.scripts]
hat-syslog-server = "hat.syslog.server.main:main"
hat-syslog-generator = "hat.syslog.generator:main"

[project.urls]
Homepage = "http://hat-open.com"
Repository = "https://github.com/hat-open/hat-syslog.git"
Documentation = "http://hat-syslog.hat-open.com"

[dependency-groups]
run = [
    "appdirs ~=1.4.4",
    "hat-aio ~=0.7.15",
    "hat-json ~=0.6.9",
    "hat-juggler ~=0.7.8",
    "hat-util ~=0.6.25",
]
build = ["hat-doit ~=0.17.1"]
dev = [
    {include-group = "run"},
    {include-group = "build"},
    "sphinxcontrib-plantuml >=0.25",
    "sphinxcontrib-programoutput >=0.17",
]

[build-system]
requires = ["hat-doit ~=0.17.1"]
build-backend = "hat.doit.pep517"

[tool.pytest.ini_options]
testpaths = ["test_pytest"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 300

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
include = ["src_py/*"]
data_file = "build/.coverage"
